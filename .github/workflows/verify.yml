name: Verify AppShell editions

on:
  push:
  pull_request:

jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v6
      - run: python -m pip install pytest setuptools wheel
      - run: python scripts/qualify.py
      - run: python -m pip install -e python --no-deps
      - run: python -m pytest python/tests -q -m "not integration"
      # Native UI and external package resolution are qualified on real target machines.
  powershell:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            shell: pwsh
          - os: windows-latest
            shell: pwsh
          - os: windows-latest
            shell: powershell
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Pester + module tests
        shell: ${{ matrix.shell }}
        run: |
          Install-Module Pester -MinimumVersion 5.5.0 -Force -Scope CurrentUser -SkipPublisherCheck
          $result = Invoke-Pester -Path './powershell/tests', './examples/powershell/Greeter/tests' -PassThru
          if ($result.FailedCount -gt 0) { exit 1 }
